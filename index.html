<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiny Talk Notes – Baca Itu, Bikin Kamu Jadi Tau!</title>
<meta name="description" content="Kartu fun fact interaktif untuk anak-anak. Klik gambarnya dan temukan fakta serunya!">
<meta name="theme-color" content="#1C2A7B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23FFC301'/%3E%3Cpath d='M30 24h22a26 26 0 0 1 0 52H30z' fill='%231C2A7B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true">
  <i class="shape s1"></i><i class="shape s2"></i><i class="shape s3"></i>
  <i class="shape s4"></i><i class="shape s5"></i><i class="shape s6"></i>
</div>

<header class="top">
  <img class="logo" src="assets/logo.webp" alt="Tiny Talk Notes" width="64" height="54">
  <div class="stars" id="stars" role="img" aria-label="Bintang: 0 dari 4"></div>
</header>

<main class="stage-wrap" id="stageWrap">
  <div class="stage" id="stage"></div>
</main>

<footer class="bottom">
  <p class="hint" id="hint" aria-live="polite"></p>
  <button class="btn-start" id="btnStart" type="button">Mulai Baca</button>
  <nav class="nav" id="nav" aria-label="Pindah kartu">
    <button class="btn-round" id="btnPrev" type="button" aria-label="Kartu sebelumnya">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
    </button>
    <div class="dots" id="dots"></div>
    <button class="btn-round" id="btnNext" type="button" aria-label="Kartu berikutnya">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
    </button>
  </nav>
</footer>

<script src="app.js"></script>
</body>
</html>
